version: 2
updates:
  # Dépendances npm (Nuxt, Vue, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 5
    groups:
      mineures-et-correctifs:
        update-types: ["minor", "patch"]

  # Image de base du Dockerfile (node:24.x.y-alpine)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Brussels"
    ignore:
      # Rester sur Node 24 LTS : les changements de version majeure se décident à la main
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
